esphome:
  name: klingel

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

# Enable fallback hotspot (captive portal) in case wifi connection fails
ap:
  ssid: "Klingel Fallback Hotspot"
  password: !secret ap_klingel_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin: D1
    name: "Klingel"
    filters:
      - delayed_on: 10ms

switch:
  - platform: gpio
    pin: D2
    id: oeffner
    name: "Haustueroeffner"
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: oeffner

  - platform: gpio
    pin: D5
    id: licht
    name: "Hausflurlicht"
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: licht
