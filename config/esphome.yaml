esphome:
  name: doorbell

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

# Enable fallback hotspot (captive portal) in case wifi connection fails
ap:
  ssid: "Doorbell Fallback Hotspot"
  password: !secret ap_doorbell_password

captive_portal:

binary_sensor:
  - platform: gpio
    pin: D1
    name: "Doorbell"
    filters:
      - delayed_on: 10ms

switch:
  - platform: gpio
    pin: D2
    id: door_opener
    name: "Door opener"
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: door_opener

  - platform: gpio
    pin: D5
    id: hallway_light
    name: "Hallway light"
    on_turn_on:
      - delay: 100ms
      - switch.turn_off: hallway_light
